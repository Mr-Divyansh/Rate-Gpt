name: Production smoke checks

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Verify deployed Rate-GPT
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node.js 24 runtime)
        with:
          node-version: 22
      - name: Download source archive
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          curl --fail --silent --show-error --location \
            "https://codeload.github.com/${SOURCE_REPOSITORY}/tar.gz/${SOURCE_SHA}" \
            | tar --extract --gzip --strip-components=1
      - name: Install dependencies
        run: npm ci
      - name: Wait for this release to reach production
        id: release
        env:
          BASE_URL: https://rate-gpt.vercel.app
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent "$BASE_URL/api/v1/health" >/dev/null \
              && curl --fail --silent "$BASE_URL/api/v1/" | grep -q '"priceStorage":"disabled"' \
              && curl --fail --silent "$BASE_URL/openapi.json" | grep -q '"openapi": "3.1.0"' \
              && curl --fail --silent "$BASE_URL/llms.txt" | grep -q 'OpenAPI specification'; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "The current AI-enabled release is available on production."
              exit 0
            fi
            sleep 10
          done
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::error::Production is still serving an older release or the new deployment is rate-limited. The release is not verified; public smoke tests cannot run against stale code."
          exit 1
      - name: Run public production checks
        if: steps.release.outputs.ready == 'true'
        run: npm run test:production
