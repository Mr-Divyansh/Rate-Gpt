<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#174D38">
  <title>Calculator | rategpt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/calculator.css">
  <link rel="stylesheet" href="style/global-nav.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="rategpt home">
      <span class="brand-mark" aria-hidden="true">r</span>
      <span>rategpt</span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Open navigation" aria-controls="navLinks" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="mandi-prices.html">Mandi Prices</a>
      <a class="active" href="calculator.html">Calculator</a>
      <a href="comparison.html">Comparison</a>
      <a href="crops.html">Crops</a>
      <a href="price-trends.html">Price Trends</a>
      <a href="watchlist.html">Watchlist</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <h1>Calculator</h1>
        <p>Compute and compare mandi price figures with the calculator module.</p>
      </div>
    </section>
  </main>

  <script>
    const menuButton = document.querySelector(".menu-toggle");
    const nav = document.querySelector(".nav-links");
    const closeMenu = () => {
      nav.classList.remove("is-open");
      menuButton.setAttribute("aria-expanded", "false");
      menuButton.setAttribute("aria-label", "Open navigation");
    };
    menuButton.addEventListener("click", () => {
      const open = nav.classList.toggle("is-open");
      menuButton.setAttribute("aria-expanded", String(open));
      menuButton.setAttribute("aria-label", open ? "Close navigation" : "Open navigation");
    });
    nav.addEventListener("click", (event) => {
      if (event.target.closest("a")) closeMenu();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeMenu();
    });
  </script>
  <script type="module" src="/script/global-nav.js"></script>
</body>
</html>
